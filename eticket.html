<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>E-ticket – BUNAVIA</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#EEF2F7;color:#0F1C2E;font:400 16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#0B1730;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,calc((100% - 680px)/2))}
.bar a.home{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.bar a.home img{width:30px;height:28px}
.tools{display:flex;gap:8px;align-items:center}
.tools select,.tools button{font:500 14px Roboto,system-ui,sans-serif;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 12px;cursor:pointer}
.tools select option{color:#0F1C2E}
.tools button.pr{background:#F5A524;border-color:#F5A524;color:#0F1C2E;font-weight:700}
main{min-height:60vh}
.box{max-width:480px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(15,28,46,.08)}
.box h1{font-size:22px;margin:0 0 6px}
.box p{color:#4C5E73;margin:0 0 16px}
.box label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.box input{width:100%;font:400 16px Roboto,system-ui,sans-serif;border:1px solid #C9D4E2;border-radius:10px;padding:11px 12px}
.box button{margin-top:16px;width:100%;font:700 16px Roboto,system-ui,sans-serif;border:0;border-radius:10px;padding:13px;background:#1D6FD8;color:#fff;cursor:pointer}
.msg{margin-top:12px;font-weight:600;color:#B42318}.msg:empty{display:none}
.msg.info{color:#1D6FD8}
:focus-visible{outline:3px solid #8FB4DE;outline-offset:2px}
@media (max-width:480px){.bar .home span{display:none}.tools select{max-width:110px}}
@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff}
  .bar{display:none}
  #ticket > table{background:#fff!important}
  #ticket > table > tbody > tr > td{padding:0!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,table{page-break-inside:avoid;break-inside:avoid}
}
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="/"><img src="eticket-logo.png" alt=""><span>BUNAVIA</span></a>
  <div class="tools" id="tools" hidden>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="sq">Shqip</option></select>
    <button type="button" class="pr" id="print">PDF</button>
  </div>
</div>
<main id="main">
  <div class="box" id="look" hidden>
    <h1 id="lt">Find your e-ticket</h1>
    <p id="lp">Enter your booking reference and the last name of one passenger.</p>
    <form id="lf" novalidate>
      <label for="ref" id="lr">Booking reference</label><input id="ref" autocomplete="off" autocapitalize="characters" maxlength="9" placeholder="BNV…" required>
      <label for="last" id="ll">Last name</label><input id="last" autocomplete="family-name" maxlength="60" required>
      <button type="submit" id="lb">Show e-ticket</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div id="ticket"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="eticket-render.js"></script>
<script>
(function(){
  var SB_URL='https://sxhmsjnyddzdbexmrkok.supabase.co',SB_KEY='sb_publishable_Bq1gCMyeOtKvWzfjRb6hHw_dvPe2_ZQ';
  var UI={
    en:{lt:'Find your e-ticket',lp:'Enter your booking reference and the last name of one passenger.',lr:'Booking reference',ll:'Last name',lb:'Show e-ticket',
        wait:'Please wait...',nf:'We could not find an issued ticket with these details. If you paid recently, your ticket may not be issued yet. Call us on +383 46 100 031.',
        fill:'Please enter the booking reference and last name.',off:'The e-ticket service is not available right now. Please try again later or contact info@bunavia.com.',pdf:'Print / PDF',bad:'This e-ticket link is not valid or the ticket is not issued yet.'},
    de:{lt:'E-Ticket finden',lp:'Geben Sie Ihre Buchungsnummer und den Nachnamen eines Passagiers ein.',lr:'Buchungsnummer',ll:'Nachname',lb:'E-Ticket anzeigen',
        wait:'Bitte warten...',nf:'Wir haben kein ausgestelltes Ticket mit diesen Angaben gefunden. Wenn Sie gerade bezahlt haben, ist Ihr Ticket vielleicht noch nicht ausgestellt. Rufen Sie uns an: +383 46 100 031.',
        fill:'Bitte Buchungsnummer und Nachnamen eingeben.',off:'Der E-Ticket-Dienst ist gerade nicht verfügbar. Bitte später erneut versuchen oder info@bunavia.com kontaktieren.',pdf:'Drucken / PDF',bad:'Dieser E-Ticket-Link ist ungültig oder das Ticket ist noch nicht ausgestellt.'},
    fr:{lt:'Trouver votre billet',lp:'Saisissez votre référence de réservation et le nom de famille d’un passager.',lr:'Référence de réservation',ll:'Nom de famille',lb:'Afficher le billet',
        wait:'Veuillez patienter...',nf:'Nous n’avons trouvé aucun billet émis avec ces informations. Si vous venez de payer, votre billet n’est peut-être pas encore émis. Appelez-nous au +383 46 100 031.',
        fill:'Saisissez la référence et le nom de famille.',off:'Le service de billets n’est pas disponible pour le moment. Réessayez plus tard ou écrivez à info@bunavia.com.',pdf:'Imprimer / PDF',bad:'Ce lien n’est pas valable ou le billet n’est pas encore émis.'},
    sq:{lt:'Gjeni biletën tuaj',lp:'Shkruani referencën e rezervimit dhe mbiemrin e një pasagjeri.',lr:'Referenca e rezervimit',ll:'Mbiemri',lb:'Shfaq biletën',
        wait:'Ju lutemi prisni...',nf:'Nuk gjetëm biletë të lëshuar me këto të dhëna. Nëse sapo keni paguar, bileta mund të mos jetë lëshuar ende. Na telefononi në +383 46 100 031.',
        fill:'Ju lutemi shkruani referencën dhe mbiemrin.',off:'Shërbimi i biletave nuk është i disponueshëm tani. Provoni më vonë ose shkruani në info@bunavia.com.',pdf:'Printo / PDF',bad:'Ky link i biletës nuk është i vlefshëm ose bileta nuk është lëshuar ende.'}
  };
  function $(i){return document.getElementById(i)}
  var lang='en',data=null,test=false;
  try{var s=localStorage.getItem('bv_lang');if(UI[s])lang=s;else{var n=(navigator.language||'').slice(0,2);if(UI[n])lang=n}}catch(e){}
  function u(k){return (UI[lang]||UI.en)[k]}
  function applyUI(){document.documentElement.lang=lang;['lt','lp','lr','ll','lb'].forEach(function(k){$(k).textContent=u(k)});$('print').textContent=u('pdf');$('lang').value=lang}
  function show(b){
    data=b;if(b.language&&UI[String(b.language).slice(0,2)]&&!show.chosen)lang=String(b.language).slice(0,2);
    applyUI();$('look').hidden=true;$('tools').hidden=false;
    $('ticket').innerHTML=BunaviaETicket.render(b,{lang:lang,logo:'eticket-logo.png',test:test});
    document.title=(test?'[TEST] ':'')+'E-ticket '+b.reference+' – BUNAVIA';
  }
  function ask(m,cls){applyUI();$('look').hidden=false;$('tools').hidden=true;$('ticket').innerHTML='';var g=$('msg');g.className='msg'+(cls?' '+cls:'');g.textContent=m||''}
  $('lang').addEventListener('change',function(){lang=this.value;show.chosen=true;try{localStorage.setItem('bv_lang',lang)}catch(e){}if(data)show(data);else applyUI()});
  $('print').addEventListener('click',function(){window.print()});

  var sb=null;try{if(window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
  function byRef(ref,last){
    if(!sb)return ask(u('off'));
    ask(u('wait'),'info');$('ref').value=ref;$('last').value=last;
    sb.rpc('get_eticket_by_ref',{p_reference:ref,p_last_name:last}).then(function(r){
      if(r.error)return ask(u('off'));
      if(!r.data)return ask(u('nf'));
      show(r.data);
    }).catch(function(){ask(u('off'))});
  }
  $('lf').addEventListener('submit',function(e){
    e.preventDefault();var ref=$('ref').value.trim().toUpperCase(),last=$('last').value.trim();
    if(!ref||last.length<2)return ask(u('fill'));
    byRef(ref,last);
  });

  var q=new URLSearchParams(location.search),tok=q.get('t');
  if(q.get('demo')==='1'){test=true;var d=BunaviaETicket.demo();if(UI[q.get('lang')]){lang=q.get('lang');show.chosen=true}show(d);return}
  if(tok){
    if(!/^[0-9a-f-]{36}$/i.test(tok))return ask(u('bad'));
    if(!sb)return ask(u('off'));
    ask(u('wait'),'info');
    sb.rpc('get_eticket',{p_token:tok}).then(function(r){
      if(r.error)return ask(u('off'));
      if(!r.data)return ask(u('bad'));
      show(r.data);
    }).catch(function(){ask(u('off'))});
    return;
  }
  var saved=null;try{saved=JSON.parse(sessionStorage.getItem('bv_et')||'null');sessionStorage.removeItem('bv_et')}catch(e){}
  var h=(location.hash.match(/ref=([A-Z0-9]+)/i)||[])[1];
  if(saved&&saved.ref&&saved.last)return byRef(saved.ref,saved.last);
  ask('');if(h)$('ref').value=h.toUpperCase();
})();
</script>
</body>
</html>
